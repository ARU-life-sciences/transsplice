[package]
name = "transsplice"
version = "0.2.1"
edition = "2024"

description = """
transsplice reconstructs trans-spliced plant organellar genes (nad1, nad2,
nad5, rps3) whose exons are scattered across separate genomic loci -
sometimes on opposite strands - by assigning candidate fragments to gene
slots and arbitrating ambiguous assignments with a whole-gene alignment
score rather than trusting per-slot evidence alone.
"""

license = "MIT"
documentation = "https://github.com/ARU-life-sciences/transsplice"
homepage = "https://github.com/ARU-life-sciences/transsplice"
repository = "https://github.com/ARU-life-sciences/transsplice"
keywords = ["bioinformatics", "genomics", "trans-splicing", "organelle"]
categories = ["command-line-utilities", "science"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
rayon = "1.12.0"
# From crates.io, so a build from this repo's release tarball (bioconda) is
# self-contained. To build against a local orfedit checkout instead, add
#   [patch.crates-io]
#   orfedit = { path = "../orfedit" }
# to an uncommitted .cargo/config.toml. Bump the pinned version here
# whenever orfedit is republished.
orfedit = "0.1.0"
